[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "choir-birthdays"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1",
  "gspread>=6.0", "google-auth>=2.0", "requests>=2.31",
  "python-dotenv>=1.0", "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.17,<0.18"]
web = ["streamlit>=1.40"]

[project.scripts]
birthdays = "birthdays.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]