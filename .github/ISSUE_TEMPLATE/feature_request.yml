name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should the app do?
  - type: dropdown
    id: unit
    attributes:
      label: Which unit?
      options: [Choir, Newcomers, All units]