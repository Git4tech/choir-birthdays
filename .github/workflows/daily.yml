name: Daily birthday reminders
on:
  schedule:
    - cron: "7 7 * * *"
    - cron: "7 8 * * *"
    - cron: "7 9 * * *"
    - cron: "7 10 * * *"
  workflow_dispatch:
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      NOTIFIER: callmebot
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      APP_TIMEZONE: Europe/Lisbon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - run: alembic upgrade head
      - run: birthdays sync || echo "::warning::Sheet sync failed, using last known data"
      - run: birthdays remind